services:
  frontend:
    container_name: docker-nexus-frontend
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8097
    ports:
      - "3050:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8097
    depends_on:
      - backend

  backend:
    container_name: docker-nexus-backend
    build: ./backend
    ports:
      - "8097:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/deployments:/app/deployments
    environment:
      - STORE_FILE=/app/store.json
      - DEPLOY_DIR=/app/deployments
      - PORT=8080
      - DB_HOST=postgres
      - DB_USER=nexus
      - DB_PASSWORD=nexus_secret
      - DB_NAME=nexus_db
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: docker-nexus-postgres
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus_secret
      - POSTGRES_DB=nexus_db
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
